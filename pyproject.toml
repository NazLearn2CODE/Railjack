[project]
name = "orbiter"
version = "0.1.0"
description = "Orbiter — a locally-hosted Agentic OS (orchestration core + dashboard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "claude-agent-sdk==0.1.81",
    "websockets>=13",
    # ponytail: deps declared; app/ scaffold + security libs (landlock, etc.) added by the build agent
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.pytest.ini_options]
# ponytail: put project root on sys.path so `pytest` (not just `python -m pytest`)
# resolves `from app.core...`. Without this the bare `.venv/bin/pytest` invocation
# used in CI/plans fails with ModuleNotFoundError: No module named 'app'.
pythonpath = ["."]

[tool.ruff]
line-length = 100
