[project]
name = "railjack"
version = "0.2.0"
description = "Railjack — a modular per-machine hub of local services (mission-control dashboard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.pytest.ini_options]
# ponytail: put project root on sys.path so `pytest` (not just `python -m pytest`)
# resolves `from app...`. Without this the bare `.venv/bin/pytest` invocation
# used in CI/plans fails with ModuleNotFoundError: No module named 'app'.
pythonpath = ["."]

[tool.ruff]
line-length = 100
