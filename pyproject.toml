[project]
name = "orbiter"
version = "0.1.0"
description = "Orbiter — a locally-hosted Agentic OS (orchestration core + dashboard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "claude-agent-sdk==0.1.81",
    "websockets>=13",
    "httpx>=0.27",
    # ponytail: deps declared; app/ scaffold + security libs (landlock, etc.) added by the build agent
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
