machine: orbiter-grimoldi
hostnames: [orokin]           # office machine hostname (Orokin); rename TBD
modules:
  - id: tmux
    title: TERMINAL
    kind: iframe
    url: http://localhost:7681
    health: { type: http, url: "http://localhost:7681/" }
    manage: { type: systemd-user, unit: ttyd.service, extra_units: [ttyd-upload.service] }
  # n8n refuses framing by default — embed only after setting
  # N8N_CONTENT_SECURITY_POLICY / frame-ancestors on the n8n side.
  # See A-project/decisions/2026-07-18-pivot-local-services-hub.md.
