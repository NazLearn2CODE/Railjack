machine: tawhan
hostnames: [bazzite]          # `hostname -s` on the Tawhan (home) machine
modules:
  - id: tmux
    title: TERMINAL
    kind: iframe
    url: http://localhost:7681
    health: { type: http, url: "http://localhost:7681/" }
    manage: { type: systemd-user, unit: ttyd.service, extra_units: [ttyd-upload.service] }
    options:
      tmux_session: main
  - id: comfyui
    title: COMFYUI
    kind: panel
    panel: comfyui
    health: { type: http, url: "http://127.0.0.1:8188/system_stats" }
    manage:
      type: command
      start: ["bash", "/home/NAZ/.claude/skills/f5-comfyui-media/scripts/comfy.sh", "start"]
      stop:  ["bash", "/home/NAZ/.claude/skills/f5-comfyui-media/scripts/comfy.sh", "stop"]
      log:   ["bash", "/home/NAZ/.claude/skills/f5-comfyui-media/scripts/comfy.sh", "log"]
      start_timeout_s: 150
    options:
      checkout: "/var/home/NAZ/Coding Projects/ComfyUI"
      models_dir: "/var/home/NAZ/Coding Projects/ComfyUI/models"
      output_dir: "/var/home/NAZ/Coding Projects/ComfyUI/output"
      vram_gb: 24
      api: "http://127.0.0.1:8188"
  - id: ffmpeg
    title: VIDEO LAB
    kind: panel
    panel: ffmpeg
    options:
      # media_dirs seed the workspace on first load; ADD FOOTAGE can pull from
      # anywhere under browse_root (~). output_dir is the default render folder.
      media_dirs: ["~/Downloads/B-Rolls", "~/Videos", "~/ttyd-drops"]
      lut_dir: "~/Videos/LUTs"
      browse_root: "~"
      output_dir: "~/Downloads/VDO Outputs"
  - id: notebooklm
    title: RESEARCH
    kind: panel
    panel: notebooklm
    options:
      output_dir: "~/Downloads/NotebookLM Outputs"
      browse_root: "~"

# M6 cockpit — session telemetry, terminal buttons, catalog grouping.

providers:
  - name: anthropic
    model_match: "^claude-"
    window_hours: 5
    context_limit: 200000           # fallback only — per-model table in session_stats._MODEL_CONTEXT_LIMITS wins
    usage_source: anthropic-oauth   # reads ~/.claude/.credentials.json (Claude Code keeps it fresh)
  - name: zai
    model_match: "^glm-"
    window_hours: 5
    context_limit: 200000           # fallback only — glm-5.2 resolves to 1M via the per-model table
    usage_source: zai-quota         # rate-ck endpoint; needs the key below in the server env
    key_env: ZAI_API_KEY

buttons:
  - label: BOOTSTRAP
    insert: "Bootstrap: read hot.md, index.md, Cephalon.md, CLAUDE.md (+ .claude/agents), run python3 vault-check.py, git pull --ff-only to sync CephalonVoid, then give me a one-line status."
  - label: COMMIT & PUSH
    insert: "Session-end per Cephalon.md: update hot.md + logs/memory-log.md, run python3 vault-check.py, then commit and push the vault to CephalonVoid."

catalog:
  mcp_insert_template: "use the {name} MCP to "
  groups:
    - { name: F5, match: "^f5-" }
    - { name: MEDIA, match: "comfyui|ffmpeg|davinci|youtube|story|channel|case|resolve" }
    - { name: RESEARCH, match: "reach|search|reader|zread|newstank|notebooklm|radar" }
    - { name: AGENTS, match: "agent|subagent|delegate|llm" }
    - { name: WORKSPACE, match: "google|obsidian|workspace" }
